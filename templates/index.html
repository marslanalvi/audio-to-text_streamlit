<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urdu Audio Transcription</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card reveal">
        <p class="badge">Urdu Diarized Transcription</p>
        <h1>Upload audio and get clean speaker-wise text.</h1>
        <p class="subtext">
          Supported formats: MP3, WAV, M4A, OPUS. Output is formatted as Speaker 1, Speaker 2, and onward.
        </p>

        <form id="upload-form" class="upload-form">
          <label id="drop-zone" for="audio-file" class="drop-zone">
            <span class="drop-title">Drop your audio here</span>
            <span class="drop-subtitle">or click to browse (MP3, WAV, M4A, OPUS)</span>
          </label>
          <input id="audio-file" name="file" type="file" accept=".mp3,.wav,.m4a,.opus,audio/*" required />
          <div class="file-meta-row">
            <p id="file-meta" class="file-meta">No file selected</p>
            <audio id="audio-preview" class="audio-preview" controls hidden></audio>
          </div>
          <button id="submit-btn" type="submit">Transcribe</button>
        </form>
        <div id="loader-overlay" class="loader-overlay" hidden>
          <div class="loader-box">
            <div class="loader-spinner" aria-hidden="true"></div>
            <p id="loader-text" class="loader-text">Uploading audio...</p>
            <div class="loader-track">
              <div id="loader-bar" class="loader-bar"></div>
            </div>
            <p id="loader-elapsed" class="loader-elapsed">0s elapsed</p>
          </div>
        </div>

        <p id="status" class="status"></p>
        <div class="result-toolbar">
          <span class="result-label">Result</span>
          <div class="result-actions">
            <button id="copy-btn" type="button" class="ghost-btn" disabled>Copy</button>
            <button id="download-btn" type="button" class="ghost-btn" disabled>Download .txt</button>
          </div>
        </div>
        <pre id="result" class="result" aria-live="polite"></pre>
        <div class="minutes-wrap">
          <p class="result-label">Meeting Minutes (English, 5 lines)</p>
          <pre id="minutes-en" class="minutes" aria-live="polite"></pre>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
